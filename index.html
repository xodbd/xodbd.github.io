    />

    <!-- 링크 공유 미리보기 (카카오톡, 슬랙, 메일 등) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xodbd.github.io/" />
    <meta property="og:site_name" content="Yung's portfolio" />
    <meta property="og:title" content="Yung's portfolio | 웹퍼블리셔 김태융" />

      property="og:description"
      content="바탕화면의 폴더를 열어 경력과 작업물을 확인해 보세요."

    <meta property="og:image" content="https://xodbd.github.io/og-image.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="./manifest.json" />

    <!-- 테마를 첫 화면이 그려지기 전에 적용 (깜빡임 방지). 키·기본값(다크)은 src/lib/theme.js 와 동일하게 -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <script type="module" crossorigin src="./assets/index-DnXwdD5K.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/jsx-runtime-BIUEfZIL.js">
    <link rel="modulepreload" crossorigin href="./assets/iconBase-pxwTgg4z.js">
    <link rel="modulepreload" crossorigin href="./assets/io5-H4yowvyY.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BYOmun9o.css">
  </head>
  <body>
    <!-- 리퀴드 글래스 굴절 필터 (.is-chromium .glass 에서 backdrop-filter로 사용) -->
    <svg aria-hidden="true" style="position:absolute; width:0; height:0; overflow:hidden;">
      <!-- color-interpolation-filters="sRGB": 기본값(linearRGB)이면 맵의 128(중립값)이 변환돼서 화면 전체가 한쪽으로 밀린다 -->
      <filter id="liquid-refraction" color-interpolation-filters="sRGB">
        <feImage href="displacement-map.png" preserveAspectRatio="none" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="20" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="wrap"></div>
  </body>
</html>
